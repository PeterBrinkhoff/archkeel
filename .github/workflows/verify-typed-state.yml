name: Verify typed state protocol
on:
  push:
    branches: [fix/issue-542-typed-state-protocol]
permissions:
  contents: read
jobs:
  state-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.11.12"
          version: "0.12.13"
      - run: uv sync --locked
      - name: Format and export exact source patch
        run: |
          uv run --locked ruff check --select I --fix src/archkeel/ir/state_facts.py src/archkeel/ir/state_codec.py src/archkeel/analyzer/python/state.py src/archkeel/check/evaluation/state.py tests/test_typed_state_protocol.py
          uv run --locked ruff format src/archkeel/ir/state_facts.py src/archkeel/ir/state_codec.py src/archkeel/analyzer/python/state.py src/archkeel/check/evaluation/state.py tests/test_typed_state_protocol.py
          python - <<'PY'
          import base64, subprocess
          print("FORMAT_PATCH=" + base64.b64encode(subprocess.check_output(["git", "diff", "--", "src", "tests"])).decode())
          PY
      - name: Style, types and hygiene
        run: |
          uv run --locked ruff check src/archkeel/ir/state_facts.py src/archkeel/ir/state_codec.py src/archkeel/analyzer/python/state.py src/archkeel/check/evaluation/state.py tests/test_typed_state_protocol.py
          make typecheck
          uv run --locked python -m pytest -q tests/test_repository_hygiene.py
      - name: Native and wire state controls
        run: uv run --locked python -m pytest -q tests/test_typed_state_protocol.py tests/test_state_facts.py tests/test_collection_protocol.py
